name: Deploy Frontend to AWS EC2

on:
  push:
    branches:
      - main
      - Deployment_AmityPunjab
    paths:
      - 'frontend/**'
      - 'docker-compose.ec2.yml'
      - 'Caddyfile'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Owner for GHCR
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/${OWNER_LOWER}/suits-frontend:latest" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            VITE_API_URL=/api
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Frontend Container to AWS EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GHCR_PAT: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          FRONTEND_IMAGE: ${{ env.IMAGE_TAG }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "Error: EC2_HOST and EC2_SSH_KEY secrets must be configured in GitHub Repository Secrets."
            exit 1
          fi

          EC2_USER="${EC2_USER:-ubuntu}"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key "${EC2_USER}@${EC2_HOST}" "mkdir -p ~/suits"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key docker-compose.ec2.yml Caddyfile deploy/ec2-setup.sh "${EC2_USER}@${EC2_HOST}:~/suits/"

          if [ -n "$GHCR_PAT" ]; then
            printf '%s\n' "$GHCR_PAT" | ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key "${EC2_USER}@${EC2_HOST}" \
              "docker login ghcr.io -u '${GHCR_USER}' --password-stdin"
          fi

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key "${EC2_USER}@${EC2_HOST}" \
            "FRONTEND_IMAGE='${FRONTEND_IMAGE}' bash -s" << 'EOF'
            set -euo pipefail
            cd ~/suits

            if [ ! -f .env ]; then
              echo "Error: ~/suits/.env is missing on EC2."
              exit 1
            fi

            export FRONTEND_IMAGE
            docker compose -f docker-compose.ec2.yml pull frontend
            docker compose -f docker-compose.ec2.yml up -d --remove-orphans frontend caddy
            docker image prune -f

            echo "Waiting for frontend web server..."
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
                echo ""
                echo "Frontend is healthy and serving SUITS!"
                exit 0
              fi
              sleep 2
            done
            echo "Frontend health check timed out; showing recent logs:"
            docker compose -f docker-compose.ec2.yml logs --tail=50 frontend
            exit 1
          EOF
